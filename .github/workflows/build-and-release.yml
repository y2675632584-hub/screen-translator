name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: bash scripts/build-app.sh
      - name: Package macOS app
        run: ditto -c -k --keepParent "dist/屏幕译.app" ScreenTranslator-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-macOS-arm64
          path: ScreenTranslator-macOS-arm64.zip

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows portable app
        shell: pwsh
        run: |
          dotnet publish windows/ScreenTranslator.Win/ScreenTranslator.Win.csproj -c Release -r win-x64 --self-contained true -o publish/windows-x64
          Copy-Item windows/README.md publish/windows-x64/README.md
          Copy-Item LICENSE publish/windows-x64/LICENSE.txt
          Copy-Item PRIVACY.md publish/windows-x64/PRIVACY.md
          Compress-Archive -Path publish/windows-x64/* -DestinationPath ScreenTranslator-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Windows-x64
          path: ScreenTranslator-Windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes --title "屏幕译 ${GITHUB_REF_NAME}"
          fi
