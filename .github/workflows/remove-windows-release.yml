name: Remove Windows release asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-release:
    if: github.event.head_commit.message == 'Remove Windows release asset'
    runs-on: ubuntu-latest
    steps:
      - name: Remove Windows download and update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/545935664"
          cat > release-notes.md <<'EOF'
          屏幕译目前仅提供 macOS 版本。

          - 使用 Apple Vision 与 Apple Translation 在本机识别和翻译。
          - 无需 API Key。
          - 支持自定义快捷键、实时/单次翻译、自动识别或手动选择原文语言，以及目标语言选择。
          - 覆盖层支持点击穿透，关闭后立即停止采集。

          安装提示：当前安装包尚未购买商业代码签名证书。macOS 首次打开请使用 Control 点击 → 打开。

          SHA-256：
          - macOS: 8905e64c280345844b66ad0d3306a7bc80997af87b8a0b723e9314a7945059e0
          EOF
          gh release edit v1.3.0 --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
