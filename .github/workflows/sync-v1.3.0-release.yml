name: Sync v1.3.0 release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Sync v1.3.0 release checksums'
    runs-on: ubuntu-latest
    steps:
      - name: Correct release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          首个公开版本，提供 macOS 与 Windows 两个平台的下载包。

          - macOS：系统本机 OCR 与翻译，无需 API Key；支持自定义快捷键、实时/单次翻译和多语言选择。
          - Windows：本机 OCR，只将识别出的文字发送给 OpenAI；需要用户自己的 OpenAI API Key。
          - 两个平台的覆盖层均支持点击穿透，关闭后立即停止采集。

          安装提示：当前安装包尚未购买商业代码签名证书。macOS 首次打开请使用 Control 点击 → 打开；Windows 可能显示 SmartScreen 提示。

          SHA-256：
          - Windows: 59244b088bae62f2c6e7c84a98c17ad67c8b7d9e3e318f028ef015d41057dfc4
          - macOS: 8905e64c280345844b66ad0d3306a7bc80997af87b8a0b723e9314a7945059e0
          EOF
          gh release edit v1.3.0 --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md
