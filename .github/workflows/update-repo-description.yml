name: Update repository description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-description:
    if: github.event.head_commit.message == 'Update macOS-only description'
    runs-on: ubuntu-latest
    steps:
      - name: Update description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f description='一键将屏幕外语原位翻译的 macOS 菜单栏应用'
